# ETCH · kitty
# the sixteen ANSI colours are manuscript pigments:
# lichen, moss, orpiment, lapis, murex, azurite, on ink and paper.

font_family      Iosevka Nerd Font Mono
font_size        12.0
modify_font      cell_height 112%

window_padding_width 10 14
cursor_shape         beam
cursor_beam_thickness 1.6
cursor_trail         0

tab_bar_edge         top
tab_bar_style        separator
tab_separator        "  ·  "
tab_title_template   "{index} {title}"

foreground              #d4d4d6
background              #0a0a0b
selection_foreground    #ececea
selection_background    #2c3214
cursor                  #c2d94c
cursor_text_color       #0a0a0b
url_color               #95cdd0
active_border_color     #c2d94c
inactive_border_color   #2a2a2e
active_tab_foreground   #c2d94c
active_tab_background   #0a0a0b
inactive_tab_foreground #6b6b70
inactive_tab_background #0a0a0b
tab_bar_background      #0a0a0b

# graphite
color0  #1b1b1e
color8  #45454b
# cold rose
color1  #c76b78
color9  #e08a96
# lichen
color2  #a9c24a
color10 #c2d94c
# citrine (pale, never orange)
color3  #cfc46e
color11 #e3da8f
# slate blue
color4  #6b86b8
color12 #8ea6d4
# heather
color5  #9a82b4
color13 #b9a3d2
# glacier
color6  #6fadb0
color14 #95cdd0
# zinc
color7  #b4b4b8
color15 #ececea
