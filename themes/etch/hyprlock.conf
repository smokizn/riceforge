# ETCH · hyprlock
# the closed book: the plate behind, dimmed; the hour set large; one red rule.

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = quill, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 3, quill
    animation = fadeOut, 1, 2, quill
    animation = inputFieldDots, 1, 2, quill
}

background {
    monitor =
    path = ~/.config/riceforge/current/wallpaper.png
    color = rgba(10, 10, 11, 1.0)
    blur_passes = 2
    blur_size = 5
    brightness = 0.42
    contrast = 1.0
    vibrancy = 0
}

# canonical hour, letterspaced, in lichen
label {
    monitor =
    text = cmd[update:60000] ~/.config/riceforge/current/bin/hora.sh --plain | sed 's/./& /g'
    color = rgba(194, 217, 76, 1.0)
    font_size = 12
    font_family = Iosevka Nerd Font
    position = 0, 205
    halign = center
    valign = center
}

# the hour
label {
    monitor =
    text = $TIME
    color = rgba(236, 236, 234, 1.0)
    font_size = 120
    font_family = Iosevka Nerd Font Thin
    position = 0, 110
    halign = center
    valign = center
}

# the date, written out
label {
    monitor =
    text = cmd[update:60000] d=$(date +%-d); case $d in 1|21|31) s=st;; 2|22) s=nd;; 3|23) s=rd;; *) s=th;; esac; echo "$(date +%A), the $d$s of $(date +%B)"
    color = rgba(180, 180, 184, 0.85)
    font_size = 17
    font_family = Noto Serif Light Italic
    position = 0, 10
    halign = center
    valign = center
}

# one lichen rule between the hour and the gate
shape {
    monitor =
    size = 56, 1
    color = rgba(194, 217, 76, 0.9)
    rounding = 0
    border_size = 0
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 44
    outline_thickness = 1
    rounding = 3

    outer_color = rgba(42, 42, 46, 1.0)
    inner_color = rgba(10, 10, 11, 0.85)
    font_color = rgba(236, 236, 234, 1.0)
    check_color = rgba(211, 93, 110, 1.0)
    fail_color = rgba(194, 217, 76, 1.0)
    capslock_color = rgba(211, 93, 110, 1.0)

    dots_size = 0.18
    dots_spacing = 0.55
    dots_center = true

    font_family = Noto Serif Italic
    placeholder_text = <i>welcome back, $USER</i>
    fail_text = <i>not so — $ATTEMPTS</i>
    fade_on_empty = false

    position = 0, -100
    halign = center
    valign = center
}

# colophon
label {
    monitor =
    text = ¶
    color = rgba(194, 217, 76, 0.8)
    font_size = 16
    font_family = Noto Serif
    position = 0, 48
    halign = center
    valign = bottom
}
