# NACRE · hyprlock
# the desktop dissolves into frosted light; a glass card holds the hour.
# hyprlock blurs its own background, but shapes can't blur what is behind
# them, so the card is a tinted layer over an already-blurred field.

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = silk, 0.22, 1, 0.36, 1
    bezier = jelly, 0.34, 1.56, 0.64, 1
    animation = fadeIn, 1, 4, silk
    animation = fadeOut, 1, 3, silk
    animation = inputFieldDots, 1, 3, jelly
    animation = inputFieldWidth, 1, 4, jelly
    animation = inputFieldColors, 1, 4, silk
}

background {
    monitor =
    path = ~/.config/riceforge/current/wallpaper.png
    color = rgba(10, 10, 13, 1.0)
    blur_passes = 4
    blur_size = 9
    noise = 0.02
    brightness = 0.72
    vibrancy = 0.3
}

# the glass card
shape {
    monitor =
    size = 460, 420
    color = rgba(23, 24, 29, 0.42)
    rounding = 40
    border_size = 1
    border_color = rgba(255, 255, 255, 0.32) rgba(255, 255, 255, 0.06) 90deg
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(5, 5, 12, 0.5)
    position = 0, 20
    halign = center
    valign = center
}

# the hour
label {
    monitor =
    text = $TIME
    color = rgba(226, 226, 232, 1.0)
    font_size = 96
    font_family = Mona Sans SemiBold
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(5, 5, 12, 0.35)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d %B'
    color = rgba(174, 176, 188, 0.9)
    font_size = 16
    font_family = Adwaita Sans Medium
    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    rounding = -1

    outer_color = rgba(226, 226, 232, 0.55) rgba(163, 156, 196, 0.55) rgba(142, 166, 191, 0.55) 45deg
    inner_color = rgba(5, 5, 12, 0.30)
    font_color = rgba(226, 226, 232, 1.0)
    check_color = rgba(142, 166, 191, 0.9) rgba(163, 156, 196, 0.9) 45deg
    fail_color = rgba(196, 145, 157, 0.95)
    capslock_color = rgba(200, 188, 156, 0.9)

    dots_size = 0.24
    dots_spacing = 0.45
    dots_center = true
    dots_rounding = -1

    font_family = Adwaita Sans
    placeholder_text = <span foreground="##aeb0bc">welcome back, $USER</span>
    fail_text = <span foreground="##c4919d">$FAIL</span>
    fade_on_empty = false

    position = 0, -80
    halign = center
    valign = center
}
