# NACRE · Visionary · hyprlock
# the plate dims behind smoked glass; an engraved astrolabe ring holds the
# hour, today's moon sits at its zenith. Nothing private is shown: no
# notifications, network names or devices.

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = silk, 0.22, 1, 0.36, 1
    bezier = lift, 0.34, 1.56, 0.64, 1
    animation = fadeIn, 1, 5, silk
    animation = fadeOut, 1, 3, silk
    animation = inputFieldDots, 1, 3, lift
    animation = inputFieldWidth, 1, 4, lift
    animation = inputFieldColors, 1, 4, silk
}

background {
    monitor =
    path = ~/.config/riceforge/current/wallpaper.png
    color = rgba(11, 10, 10, 1.0)
    blur_passes = 3
    blur_size = 6
    noise = 0.03
    brightness = 0.5
    contrast = 1.0
    vibrancy = 0.05
}

# the engraved ring (themes/nacre/lock/ring.png, built by shell/lockart.py)
image {
    monitor =
    path = ~/.config/riceforge/current/lock/ring.png
    size = 560
    rounding = 0
    border_size = 0
    position = 0, 70
    halign = center
    valign = center
}

# today's moon at the zenith, redrawn hourly
image {
    monitor =
    path = ~/.cache/riceforge/moon.png
    reload_time = 3600
    reload_cmd = python3 -I ~/.config/riceforge/shell/lockart.py moon
    size = 74
    rounding = -1
    border_size = 0
    position = 0, 236
    halign = center
    valign = center
}

# the hour
label {
    monitor =
    text = $TIME
    color = rgba(230, 223, 207, 1.0)
    font_size = 92
    font_family = Cormorant,Noto Serif SemiBold
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%A · %-d %B'
    color = rgba(185, 188, 194, 0.85)
    font_size = 15
    font_family = Cormorant SC,Noto Serif
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 48
    outline_thickness = 1
    rounding = 12

    outer_color = rgba(185, 188, 194, 0.55) rgba(179, 154, 94, 0.65) 45deg
    inner_color = rgba(11, 10, 10, 0.72)
    font_color = rgba(230, 223, 207, 1.0)
    check_color = rgba(179, 154, 94, 0.9)
    fail_color = rgba(168, 70, 79, 0.95)
    capslock_color = rgba(216, 195, 142, 0.9)

    dots_size = 0.22
    dots_spacing = 0.5
    dots_center = true
    dots_rounding = -1

    font_family = Adwaita Sans
    placeholder_text = <span foreground="##6e6a64"><i>speak the word, $USER</i></span>
    fail_text = <span foreground="##c98580">$FAIL</span>
    fade_on_empty = false

    position = 0, -290
    halign = center
    valign = center
}
