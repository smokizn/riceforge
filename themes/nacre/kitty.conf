# NACRE · kitty
# smoked glass: kitty makes only the background translucent (text stays
# fully opaque), Hyprland blurs what is behind it, the pearl rim is the
# window border. Monaspace Argon for text; Radon, a handwriting mono,
# for italics, so comments read like marginal notes.

font_family        family="Monaspace Argon"
bold_font          family="Monaspace Argon" style="SemiBold"
italic_font        family="Monaspace Radon"
bold_italic_font   family="Monaspace Radon" style="SemiBold"
font_size          11.5
modify_font        cell_height 118%
disable_ligatures  cursor

# the glass
background_opacity  0.58
dynamic_background_opacity yes
window_padding_width 14 18

# a liquid cursor: it smears toward where it is going and snaps in
cursor_shape              beam
cursor_beam_thickness     1.8
cursor_blink_interval     0.6 ease-in-out
cursor_trail              8
cursor_trail_decay        0.06 0.28
cursor_trail_start_threshold 3

# rounded capsule tabs
tab_bar_edge           top
tab_bar_style          powerline
tab_powerline_style    round
tab_bar_margin_width   6
tab_bar_margin_height  6 0
tab_title_template     " {index}  {title} "

foreground              #e6e4f0
background              #151622
selection_foreground    #12131c
selection_background    #c9bdff
cursor                  #c9bdff
cursor_text_color       #12131c
url_color               #9fd6f5
url_style               curly
active_border_color     #b7a8ff
inactive_border_color   #2c2d3e
active_tab_foreground   #12131c
active_tab_background   #c9bdff
active_tab_font_style   bold
inactive_tab_foreground #8b8fa6
inactive_tab_background #1f2030
tab_bar_background      none

# ANSI: pastel minerals, readable on smoked glass
# smoke
color0  #2a2b3a
color8  #5c5f75
# rose quartz
color1  #f08ea6
color9  #f7aec0
# celadon
color2  #8fd4b4
color10 #b0e6cc
# champagne
color3  #ead7a4
color11 #f4e6c2
# periwinkle
color4  #8eaaf5
color12 #b0c4fb
# lavender
color5  #c3a6f8
color13 #d8c4fc
# ice
color6  #8fd5ec
color14 #b6e6f5
# pearl
color7  #cfd0dd
color15 #f4f2fc
