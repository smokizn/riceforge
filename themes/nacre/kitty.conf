# NACRE · Visionary · kitty
# an ink-glass pane: only the default background is translucent (text and
# the prompt's chips stay opaque) and Hyprland blurs the engraved plate
# behind it. Brass cursor, a sepia selection wash, tabs as engraved chips
# matching the fish prompt (themes/nacre/fish/theme.fish).

# ── type ────────────────────────────────────────────────────────────
# Iosevka: narrow and exact, more columns per line, Nerd glyphs built in
font_family        family="Iosevka Nerd Font Mono"
bold_font          family="Iosevka Nerd Font Mono" style="SemiBold"
italic_font        auto
bold_italic_font   auto
font_size          12.5
modify_font        cell_height 124%
disable_ligatures  cursor

# ── the glass ───────────────────────────────────────────────────────
background_opacity          0.6
dynamic_background_opacity  yes
window_padding_width        16 20
hide_window_decorations     yes

# ── the cursor: a brass stylus that leaves a brief trail ────────────
cursor                       #b39a5e
cursor_text_color            background
cursor_shape                 beam
cursor_beam_thickness        1.8
cursor_blink_interval        0.6 ease-in-out
cursor_stop_blinking_after   12
cursor_trail                 8
cursor_trail_decay           0.06 0.28
cursor_trail_start_threshold 3

# ── selection: a sepia wash that keeps the text's own colours ──────
selection_foreground  none
selection_background  #3a3226

# ── links ───────────────────────────────────────────────────────────
url_color               #b9bcc2
url_style               curly
underline_hyperlinks    hover
show_hyperlink_targets  yes
# ctrl+shift+e (same key as kitty's default) with hint labels in the palette
map ctrl+shift+e kitten hints --hints-foreground-color=#0e0d0c --hints-background-color=#b39a5e --hints-text-color=#d6cbb2

# ── splits: a brass seam on the focused pane, others recede ─────────
window_border_width     1pt
draw_minimal_borders    yes
active_border_color     #b39a5e
inactive_border_color   #2a2826
bell_border_color       #a8464f
inactive_text_alpha     0.78

# a bell is a dim crimson breath, not a flash
visual_bell_duration  0.3 ease-out
visual_bell_color     #2e1c1e

# ── tabs: engraved chips, the active one warmed with brass ──────────
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     round
tab_bar_margin_width    8
tab_bar_margin_height   8 4
tab_bar_background      none
tab_title_max_length    32
tab_activity_symbol     "• "
tab_title_template      " {fmt.fg._6e6a64}{index}{fmt.fg.tab}  {title} "
active_tab_title_template " {fmt.fg._b39a5e}{index}{fmt.fg.tab}  {title} "
active_tab_foreground   #e6dfcf
active_tab_background   #2a251b
active_tab_font_style   bold
inactive_tab_foreground #6e6a64
inactive_tab_background #151413
inactive_tab_font_style normal

# ── colours ─────────────────────────────────────────────────────────
foreground  #d6cbb2
background  #0e0d0c

# ANSI: antique pigments, muted so they sit in a monochrome world
# lamp black
color0  #2a2826
color8  #57534d
# iron-oxide crimson
color1  #b0605f
color9  #c98580
# verdigris
color2  #8a9e7f
color10 #a8b89c
# ochre brass
color3  #c2a86a
color11 #d8c38e
# slate
color4  #7f8fa6
color12 #a0adc0
# madder
color5  #a08399
color13 #bba0b4
# lunar teal
color6  #86a3a0
color14 #a6bdba
# parchment
color7  #c9bfa8
color15 #e6dfcf
