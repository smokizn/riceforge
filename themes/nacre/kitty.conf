# NACRE · kitty
# smoked glass: kitty makes only the default background translucent (text
# and the prompt's chips stay opaque), Hyprland blurs what is behind it,
# and the pearl rim is the Hyprland window border. Tabs are the same
# inlaid chips as the fish prompt (themes/nacre/fish/theme.fish).

# ── type ────────────────────────────────────────────────────────────
# Iosevka: narrow and exact, more columns per line, Nerd glyphs built in
font_family        family="Iosevka Nerd Font Mono"
bold_font          family="Iosevka Nerd Font Mono" style="SemiBold"
italic_font        auto
bold_italic_font   auto
font_size          12.5
modify_font        cell_height 124%
disable_ligatures  cursor

# ── the glass ───────────────────────────────────────────────────────
background_opacity          0.6
dynamic_background_opacity  yes
window_padding_width        16 20
hide_window_decorations     yes

# ── a liquid cursor: it smears toward where it is going and snaps in ─
cursor                       #b0a9cc
cursor_text_color            background
cursor_shape                 beam
cursor_beam_thickness        1.8
cursor_blink_interval        0.6 ease-in-out
cursor_stop_blinking_after   12
cursor_trail                 8
cursor_trail_decay           0.06 0.28
cursor_trail_start_threshold 3

# ── selection: a lavender wash that keeps the text's own colours ────
selection_foreground  none
selection_background  #3b3850

# ── links ───────────────────────────────────────────────────────────
url_color               #8ea6bf
url_style               curly
underline_hyperlinks    hover
show_hyperlink_targets  yes
# ctrl+shift+e (same key as kitty's default) with hint labels in the palette
map ctrl+shift+e kitten hints --hints-foreground-color=#131418 --hints-background-color=#a39cc4 --hints-text-color=#aeb0bc

# ── splits: thin lavender seam on the focused pane, others recede ───
window_border_width     1pt
draw_minimal_borders    yes
active_border_color     #a39cc4
inactive_border_color   #2a2b31
bell_border_color       #c4919d
inactive_text_alpha     0.78

# a bell is a soft rose breath, not a flash
visual_bell_duration  0.3 ease-out
visual_bell_color     #36262c

# ── tabs: glass chips, the active one tinted lavender ───────────────
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     round
tab_bar_margin_width    8
tab_bar_margin_height   8 4
tab_bar_background      none
tab_title_max_length    32
tab_activity_symbol     "• "
tab_title_template      " {fmt.fg._777a88}{index}{fmt.fg.tab}  {title} "
active_tab_title_template " {fmt.fg._a39cc4}{index}{fmt.fg.tab}  {title} "
active_tab_foreground   #e2e2e8
active_tab_background   #2f2c3d
active_tab_font_style   bold
inactive_tab_foreground #777a88
inactive_tab_background #1c1d22
inactive_tab_font_style normal

# ── colours ─────────────────────────────────────────────────────────
foreground  #d4d4dc
background  #131418

# ANSI: muted minerals, readable on smoked glass
# graphite
color0  #2a2b31
color8  #5a5c66
# rose quartz
color1  #c48a96
color9  #d4a5af
# celadon
color2  #8db5a2
color10 #a9c9b9
# wheat
color3  #cdbf98
color11 #dcd2b6
# periwinkle
color4  #8b9cc4
color12 #a7b4d4
# dusty lavender
color5  #a99cc8
color13 #bdb3d6
# steel
color6  #8db3c2
color14 #a9c7d2
# pale silver
color7  #b9bac4
color15 #e2e2e8
