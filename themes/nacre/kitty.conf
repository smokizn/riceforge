# NACRE · kitty
# smoked glass: kitty makes only the background translucent (text stays
# fully opaque), Hyprland blurs what is behind it, the pearl rim is the
# window border. Monaspace Argon for text; Radon, a handwriting mono,
# for italics, so comments read like marginal notes.

font_family        family="Monaspace Argon"
bold_font          family="Monaspace Argon" style="SemiBold"
italic_font        family="Monaspace Radon"
bold_italic_font   family="Monaspace Radon" style="SemiBold"
font_size          11.5
modify_font        cell_height 118%
disable_ligatures  cursor

# the glass
background_opacity  0.58
dynamic_background_opacity yes
window_padding_width 14 18

# a liquid cursor: it smears toward where it is going and snaps in
cursor_shape              beam
cursor_beam_thickness     1.8
cursor_blink_interval     0.6 ease-in-out
cursor_trail              8
cursor_trail_decay        0.06 0.28
cursor_trail_start_threshold 3

# rounded capsule tabs
tab_bar_edge           top
tab_bar_style          powerline
tab_powerline_style    round
tab_bar_margin_width   6
tab_bar_margin_height  6 0
tab_title_template     " {index}  {title} "

foreground              #d4d4dc
background              #131418
selection_foreground    #101114
selection_background    #b0a9cc
cursor                  #b0a9cc
cursor_text_color       #101114
url_color               #8ea6bf
url_style               curly
active_border_color     #a39cc4
inactive_border_color   #2a2b31
active_tab_foreground   #101114
active_tab_background   #b0a9cc
active_tab_font_style   bold
inactive_tab_foreground #777a88
inactive_tab_background #1c1d22
tab_bar_background      none

# ANSI: pastel minerals, readable on smoked glass
# smoke
color0  #2a2b31
color8  #5a5c66
# rose quartz
color1  #c48a96
color9  #d4a5af
# celadon
color2  #8db5a2
color10 #a9c9b9
# champagne
color3  #cdbf98
color11 #dcd2b6
# periwinkle
color4  #8b9cc4
color12 #a7b4d4
# lavender
color5  #a99cc8
color13 #bdb3d6
# ice
color6  #8db3c2
color14 #a9c7d2
# pearl
color7  #b9bac4
