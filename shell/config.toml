# riceforge-shell defaults (tracked). Don't edit this for one machine:
# put overrides in ~/.config/riceforge-local/shell.toml (same keys), which
# ./setup writes from your timezone. `riceforge-shell quit`, then
# `riceforge session-start` to apply.

[location]
# sunrise/sunset on the astrolabe
place = "Greenwich (default)"
lat = 51.48
lon = 0.0

[widgets]
astrolabe = true
strip = true
margin_bottom = 76
margin_right = 64
