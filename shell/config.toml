# riceforge-shell settings (read at start; `riceforge-shell quit` then reopen to apply)

[location]
# used for sunrise/sunset on the astrolabe; the default comes from your timezone (Asia/Kolkata)
place = "New Delhi (timezone default)"
lat = 28.61
lon = 77.21

[widgets]
astrolabe = true
strip = true
margin_bottom = 76
margin_right = 64
